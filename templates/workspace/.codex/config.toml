[features]
hooks = true

# Optional Yunxiao MCP. Enable after creating:
# - __WORKSPACE_ROOT__\.codex\secrets\yunxiao.env.cmd
# - __WORKSPACE_ROOT__\.codex\secrets\yunxiao.personal.json
#
# [mcp_servers.yunxiao]
# command = '__WORKSPACE_ROOT__\.codex\mcp\yunxiao-mcp.cmd'
# startup_timeout_sec = 120

# >>> workspace-governance-hooks (generated; source: __WORKSPACE_ROOT__\governance\agent-guard\hook-registry.json)

[[hooks.PreToolUse]]
matcher = "Bash|apply_patch|Edit|Write"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python "__WORKSPACE_ROOT__\governance\agent-guard\pre_tool_guard.py"'
timeout = 10
statusMessage = "Checking workspace governance policy"

[[hooks.PostToolUse]]
matcher = "Bash"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'python "__WORKSPACE_ROOT__\governance\agent-guard\post_tool_guard.py"'
timeout = 10
statusMessage = "Verifying worktree lifecycle result"

# <<< workspace-governance-hooks
